; Additive Bitrix settings: load BEFORE zz-upgrade-demo.ini, never replace it.
; Network/mail/process/prepend limits stay exclusively in the demo isolation file.
; The official distribution uses short PHP tags, including its license key file.
short_open_tag=On
default_charset=UTF-8
max_input_vars=10000
max_file_uploads=100
pcre.backtrack_limit=1000000
pcre.recursion_limit=14000
realpath_cache_size=4096k
opcache.validate_timestamps=1
opcache.revalidate_freq=0
; No PATH_INFO fallback execution outside the exact Nginx endpoint allowlist.
cgi.fix_pathinfo=0
