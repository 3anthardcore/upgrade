; Defense in depth. Network isolation is configured before the first PHP process.
auto_prepend_file=/opt/upgrade/prepend.php
sendmail_path=/bin/false
mail.add_x_header=Off
allow_url_fopen=Off
allow_url_include=Off
expose_php=Off
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
memory_limit=512M
max_execution_time=60
upload_max_filesize=32M
post_max_size=36M
session.cookie_httponly=On
session.cookie_samesite=Lax
disable_functions=exec,passthru,shell_exec,system,popen,proc_open,mail
