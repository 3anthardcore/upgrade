# PRIVATE INTERACTIVE DEMO. Only own synthetic actions; no source or vendor handlers.
# The host proxy must overwrite X-Forwarded-Proto and keep the container private.
# No real_ip_header: trust only the verified TCP bridge peer plus its TLS marker.
map "$remote_addr|$http_x_forwarded_proto" $upgrade_preview_https {
    default "";
    "172.30.50.1|https" on;
}
map $upgrade_preview_https $upgrade_preview_request_scheme {
    default http;
    on https;
}
map $upgrade_preview_https $upgrade_preview_server_port {
    default $server_port;
    on 443;
}

limit_req_zone $binary_remote_addr zone=upgrade_demo_actions:1m rate=2r/s;

server {
    listen 8080;
    server_name _;
    root /var/www/html;
    charset utf-8;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    merge_slashes off;
    autoindex off;
    disable_symlinks on from=$document_root;

    auth_basic "Upgrade private partial preview";
    auth_basic_user_file /etc/nginx/demo.htpasswd;
    access_log off;
    error_log /dev/null crit;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; script-src 'none'" always;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 15s;
    send_timeout 30s;
    fastcgi_connect_timeout 5s;
    fastcgi_send_timeout 10s;
    fastcgi_read_timeout 65s;

    # Exact own stylesheet only. No vendor JS/CSS, source maps or adjacent files.
    location = /local/templates/upgrade/styles.css {
        limit_except GET { deny all; }
        try_files /local/templates/upgrade/styles.css =404;
    }

    # The accepted pilot project is pinned. Another project needs its own reviewed
    # namespace and isolated root; do not broaden this to every project on disk.
    location ~ "^/upload/upgrade/teplypol-market/[a-f0-9]{64}\.(?:png|jpg|gif|webp|avif|pdf)$" {
        limit_except GET { deny all; }
        try_files $uri =404;
    }

    # These paths never reach PHP and can never be returned as static source.
    location ~* "^/(?:bitrix|local|upload|\.well-known)(?:/|$)" { return 404; }
    location ~* "^/bitrix(?:setup|install)?\.php(?:/|$)" { return 404; }
    location ~* "(?:^|/)(?:license_key[^/]*|\.settings[^/]*|php_interface|backups?)(?:/|$)" { return 404; }
    location ~ "/\." { return 404; }
    location ~* "\.(?:inc|sql|dump|bak|old|orig|ini|env|log|zip|7z|rar|tar|gz|tgz|bz2|xz)(?:[./]|$)" { return 404; }

    # Always execute this own router, including original source URLs ending .php.
    # The URI never selects a physical source/vendor PHP file. No rewrite, PATH_INFO,
    # index lookup, directory fallback or arbitrary request-header forwarding.
    location = /__upgrade/action {
        limit_except POST { deny all; }
        limit_req zone=upgrade_demo_actions burst=10 nodelay;
        try_files /local/upgrade-route.php =404;
        fastcgi_pass_request_headers off;
        fastcgi_pass_request_body on;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param UPGRADE_ORIGIN $http_origin;
        fastcgi_param SCRIPT_NAME /local/upgrade-route.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/local/upgrade-route.php;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_HOST upgrade.help-ai-ru.ru;
        fastcgi_param UPGRADE_COOKIE_HEADER $http_cookie;
        fastcgi_param HTTP_ACCEPT $http_accept;
        fastcgi_param HTTP_ACCEPT_LANGUAGE $http_accept_language;
        fastcgi_param HTTP_USER_AGENT $http_user_agent;
        fastcgi_param HTTP_X_FORWARDED_PROTO $upgrade_preview_request_scheme;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param REQUEST_SCHEME $upgrade_preview_request_scheme;
        fastcgi_param HTTPS $upgrade_preview_https if_not_empty;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param REMOTE_PORT $remote_port;
        fastcgi_param SERVER_ADDR $server_addr;
        fastcgi_param SERVER_PORT $upgrade_preview_server_port;
        fastcgi_param SERVER_NAME $server_name;
        fastcgi_param REDIRECT_STATUS 200;
        fastcgi_intercept_errors off;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass php:9000;
    }

    location / {
        limit_except GET { deny all; }
        try_files /local/upgrade-route.php =404;
        fastcgi_pass_request_headers off;
        fastcgi_pass_request_body off;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_param SCRIPT_NAME /local/upgrade-route.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/local/upgrade-route.php;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_HOST upgrade.help-ai-ru.ru;
        fastcgi_param UPGRADE_COOKIE_HEADER $http_cookie;
        fastcgi_param HTTP_ACCEPT $http_accept;
        fastcgi_param HTTP_ACCEPT_LANGUAGE $http_accept_language;
        fastcgi_param HTTP_USER_AGENT $http_user_agent;
        fastcgi_param HTTP_X_FORWARDED_PROTO $upgrade_preview_request_scheme;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param REQUEST_SCHEME $upgrade_preview_request_scheme;
        fastcgi_param HTTPS $upgrade_preview_https if_not_empty;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param REMOTE_PORT $remote_port;
        fastcgi_param SERVER_ADDR $server_addr;
        fastcgi_param SERVER_PORT $upgrade_preview_server_port;
        fastcgi_param SERVER_NAME $server_name;
        fastcgi_param REDIRECT_STATUS 200;
        fastcgi_intercept_errors off;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass php:9000;
    }

    # Nginx-level denial/missing assets use a constant response. The own router's
    # 404 remains its rendered 404 because fastcgi_intercept_errors is off.
    error_page 404 =404 @partial_not_found;
    location @partial_not_found {
        default_type text/plain;
        return 404 "Upgrade partial preview: route not available.\n";
    }
}
