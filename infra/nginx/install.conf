# TEMPORARY PRIVATE INSTALLER ONLY. Never select this profile for a demo release.
# Host ingress must stay loopback-only: private reverse proxy or verified binding.
# conf.d is included in the http context. Trust ONLY the verified host bridge peer;
# its TLS ingress overwrites X-Forwarded-Proto, never appends a client value.
map "$remote_addr|$http_x_forwarded_proto" $upgrade_install_https {
    default "";
    "172.30.50.1|https" on;
}
map $upgrade_install_https $upgrade_install_request_scheme {
    default http;
    on https;
}
map $upgrade_install_https $upgrade_install_server_port {
    default $server_port;
    on 443;
}

server {
    listen 8080;
    server_name _;
    root /var/www/html;
    charset utf-8;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    merge_slashes off;
    autoindex off;
    disable_symlinks on from=$document_root;

    auth_basic "Upgrade private installer";
    auth_basic_user_file /etc/nginx/demo.htpasswd;
    # Installer URLs can contain licensing data. Do not record request URIs.
    access_log off;
    error_log /dev/null crit;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    client_max_body_size 36m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;
    fastcgi_connect_timeout 5s;
    fastcgi_send_timeout 30s;
    fastcgi_read_timeout 65s;

    # Internal rewrites retain the original $request_uri and query string.
    location = / { rewrite ^ /index.php last; }
    location = /bitrix/admin/ { rewrite ^ /bitrix/admin/index.php last; }

    # Official fresh-distribution wizard. SCRIPT_FILENAME is never user-derived.
    location = /index.php {
        try_files /index.php =404;
        # Explicit standard parameters avoid duplicate HTTPS/SERVER_PORT keys.
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param REQUEST_SCHEME $upgrade_install_request_scheme;
        fastcgi_param HTTPS $upgrade_install_https if_not_empty;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param REMOTE_PORT $remote_port;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_param SERVER_ADDR $server_addr;
        fastcgi_param SERVER_PORT $upgrade_install_server_port;
        fastcgi_param SERVER_NAME $server_name;
        fastcgi_param REDIRECT_STATUS 200;
        # Do not forward a spoofed proto to CMS helpers inspecting this header.
        fastcgi_param HTTP_X_FORWARDED_PROTO $upgrade_install_request_scheme;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_pass php:9000;
    }
    # Temporary own resume entry for this partially installed target only.
    location = /local/upgrade-installer-resume.php {
        try_files /local/upgrade-installer-resume.php =404;
        # Explicit standard parameters avoid duplicate HTTPS/SERVER_PORT keys.
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param REQUEST_SCHEME $upgrade_install_request_scheme;
        fastcgi_param HTTPS $upgrade_install_https if_not_empty;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param REMOTE_PORT $remote_port;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_param SERVER_ADDR $server_addr;
        fastcgi_param SERVER_PORT $upgrade_install_server_port;
        fastcgi_param SERVER_NAME $server_name;
        fastcgi_param REDIRECT_STATUS 200;
        # Do not forward a spoofed proto to CMS helpers inspecting this header.
        fastcgi_param HTTP_X_FORWARDED_PROTO $upgrade_install_request_scheme;
        fastcgi_param SCRIPT_FILENAME /var/www/html/local/upgrade-installer-resume.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_pass php:9000;
    }
    # Post-install admin landing/login; not a general admin PHP handler.
    location = /bitrix/admin/index.php {
        try_files /bitrix/admin/index.php =404;
        # Explicit standard parameters avoid duplicate HTTPS/SERVER_PORT keys.
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param REQUEST_SCHEME $upgrade_install_request_scheme;
        fastcgi_param HTTPS $upgrade_install_https if_not_empty;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param REMOTE_PORT $remote_port;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_param SERVER_ADDR $server_addr;
        fastcgi_param SERVER_PORT $upgrade_install_server_port;
        fastcgi_param SERVER_NAME $server_name;
        fastcgi_param REDIRECT_STATUS 200;
        # Do not forward a spoofed proto to CMS helpers inspecting this header.
        fastcgi_param HTTP_X_FORWARDED_PROTO $upgrade_install_request_scheme;
        fastcgi_param SCRIPT_FILENAME /var/www/html/bitrix/admin/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_pass php:9000;
    }
    # Explicit local system check. Expected egress/mail failures remain failures.
    location = /bitrix/admin/site_checker.php {
        try_files /bitrix/admin/site_checker.php =404;
        # Explicit standard parameters avoid duplicate HTTPS/SERVER_PORT keys.
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param REQUEST_SCHEME $upgrade_install_request_scheme;
        fastcgi_param HTTPS $upgrade_install_https if_not_empty;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param REMOTE_PORT $remote_port;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_param SERVER_ADDR $server_addr;
        fastcgi_param SERVER_PORT $upgrade_install_server_port;
        fastcgi_param SERVER_NAME $server_name;
        fastcgi_param REDIRECT_STATUS 200;
        # Do not forward a spoofed proto to CMS helpers inspecting this header.
        fastcgi_param HTTP_X_FORWARDED_PROTO $upgrade_install_request_scheme;
        fastcgi_param SCRIPT_FILENAME /var/www/html/bitrix/admin/site_checker.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_pass php:9000;
    }
    # Mark the isolated copy as a development installation; disable auto-checks.
    location = /bitrix/admin/settings.php {
        try_files /bitrix/admin/settings.php =404;
        # Explicit standard parameters avoid duplicate HTTPS/SERVER_PORT keys.
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param REQUEST_SCHEME $upgrade_install_request_scheme;
        fastcgi_param HTTPS $upgrade_install_https if_not_empty;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param REMOTE_PORT $remote_port;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_param SERVER_ADDR $server_addr;
        fastcgi_param SERVER_PORT $upgrade_install_server_port;
        fastcgi_param SERVER_NAME $server_name;
        fastcgi_param REDIRECT_STATUS 200;
        # Do not forward a spoofed proto to CMS helpers inspecting this header.
        fastcgi_param HTTP_X_FORWARDED_PROTO $upgrade_install_request_scheme;
        fastcgi_param SCRIPT_FILENAME /var/www/html/bitrix/admin/settings.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_pass php:9000;
    }
    # Vendor registration/status UI only; this does not grant network egress.
    location = /bitrix/admin/update_system.php {
        try_files /bitrix/admin/update_system.php =404;
        # Explicit standard parameters avoid duplicate HTTPS/SERVER_PORT keys.
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param REQUEST_SCHEME $upgrade_install_request_scheme;
        fastcgi_param HTTPS $upgrade_install_https if_not_empty;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param REMOTE_PORT $remote_port;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_param SERVER_ADDR $server_addr;
        fastcgi_param SERVER_PORT $upgrade_install_server_port;
        fastcgi_param SERVER_NAME $server_name;
        fastcgi_param REDIRECT_STATUS 200;
        # Do not forward a spoofed proto to CMS helpers inspecting this header.
        fastcgi_param HTTP_X_FORWARDED_PROTO $upgrade_install_request_scheme;
        fastcgi_param SCRIPT_FILENAME /var/www/html/bitrix/admin/update_system.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_pass php:9000;
    }

    # Read-only vendor agreement iframe observed in AgreementStep.ShowStep.
    location = /bitrix/legal/license.php {
        limit_except GET { deny all; }
        try_files /bitrix/legal/license.php =404;
        # Explicit standard parameters avoid duplicate HTTPS/SERVER_PORT keys.
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param REQUEST_SCHEME $upgrade_install_request_scheme;
        fastcgi_param HTTPS $upgrade_install_https if_not_empty;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param REMOTE_PORT $remote_port;
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_param SERVER_ADDR $server_addr;
        fastcgi_param SERVER_PORT $upgrade_install_server_port;
        fastcgi_param SERVER_NAME $server_name;
        fastcgi_param REDIRECT_STATUS 200;
        # Do not forward a spoofed proto to CMS helpers inspecting this header.
        fastcgi_param HTTP_X_FORWARDED_PROTO $upgrade_install_request_scheme;
        fastcgi_param SCRIPT_FILENAME /var/www/html/bitrix/legal/license.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_pass php:9000;
    }

    # Exact static dependencies observed in the downloaded official archive:
    # install/wizard/template.php and install/wizard/wizard.php respectively.
    location = /bitrix/modules/main/install/wizard/script.js {
        limit_except GET { deny all; }
        try_files /bitrix/modules/main/install/wizard/script.js =404;
    }
    location = /bitrix/modules/main/install/js/main/md5/dist/md5.bundle.js {
        limit_except GET { deny all; }
        try_files /bitrix/modules/main/install/js/main/md5/dist/md5.bundle.js =404;
    }

    # These regex locations MUST precede static assets. Deny even misleading
    # suffixes such as license_key.php.css, file.php/image.jpg and dump.sql.css.
    location ~* (?:^|/)(?:license_key[^/]*|\.settings[^/]*|php_interface|backups?)(?:/|$) {
        return 404;
    }
    location ~* \.(?:php[0-9]*|phtml|phar|inc|sql|dump|bak|old|orig|ini|env|log|zip|7z|rar|tar|gz|tgz|bz2|xz)(?:[./]|$) {
        return 404;
    }
    # Official wizard/admin assets only. A .default theme directory is the sole
    # hidden-segment exception; each final filename must start with a safe char.
    # No /upload, copied source files, source maps, HTML, JSON or directory listing.
    location ~ "^/bitrix/(?:themes|panel|css|js|images)/(?:(?:[A-Za-z0-9_-][A-Za-z0-9_.-]*|\.default)/)*[A-Za-z0-9_-][A-Za-z0-9_.-]*\.(?:css|js|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|otf|eot)$" {
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location ~ /\. { return 404; }

    # Own inert fallback: never execute or return source PHP as static text.
    error_page 404 =404 @installer_not_found;
    location @installer_not_found {
        default_type text/plain;
        return 404 "Upgrade private installer: route not available.\n";
    }
    location / { return 404; }
}
