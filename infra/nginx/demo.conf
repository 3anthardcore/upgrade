server {
    listen 8080;
    server_name _;
    root /var/www/html;
    charset utf-8;
    merge_slashes off;
    auth_basic "Upgrade private demo";
    auth_basic_user_file /etc/nginx/demo.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 36m;
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location ~ /\. { deny all; }
    location ~* ^/(?:upload|local)/(?:.*\.(?:php[0-9]?|phtml|phar))$ { return 403; }
    location = /local/upgrade-route.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/local/upgrade-route.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass php:9000;
    }
    location /local/ { try_files $uri =404; }
    location /upload/ { try_files $uri =404; }
    location /bitrix/ {
        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_pass php:9000;
        }
        try_files $uri $uri/ =404;
    }
    # Incoming source .php paths are routed as data; no arbitrary copied PHP execution.
    location / { rewrite ^ /local/upgrade-route.php last; }
}
